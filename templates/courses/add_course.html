{% extends 'base.html' %}

{% block content %}
<h1>افزودن دوره‌ی جدید</h1>

<form method="POST" enctype="multipart/form-data" class="mt-3">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-success">ذخیره دوره</button>
    <a href="{% url 'my_created_courses' %}" class="btn btn-secondary">بازگشت</a>
</form>
{% endblock %}
